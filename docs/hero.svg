<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bd8"/>
      <stop offset="0.55" stop-color="#8a5cc7"/>
      <stop offset="1" stop-color="#e0857a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="960" height="440" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <!-- desktop -->
    <rect width="960" height="440" fill="url(#wall)"/>

    <!-- background window: notes (left) -->
    <g transform="translate(46 70)">
      <rect width="300" height="300" rx="12" fill="#f4f1ea"/>
      <rect width="300" height="34" rx="12" fill="#e4dfd4"/>
      <rect y="22" width="300" height="12" fill="#e4dfd4"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
      <rect x="24" y="58" width="150" height="12" rx="6" fill="#c9c2b3"/>
      <rect x="24" y="86" width="250" height="8" rx="4" fill="#d8d2c5"/>
      <rect x="24" y="104" width="230" height="8" rx="4" fill="#d8d2c5"/>
      <rect x="24" y="122" width="244" height="8" rx="4" fill="#d8d2c5"/>
      <rect x="24" y="152" width="200" height="8" rx="4" fill="#d8d2c5"/>
      <rect x="24" y="170" width="236" height="8" rx="4" fill="#d8d2c5"/>
      <rect x="24" y="188" width="170" height="8" rx="4" fill="#d8d2c5"/>
    </g>

    <!-- background window: browser (right) -->
    <g transform="translate(600 46)">
      <rect width="320" height="330" rx="12" fill="#ffffff"/>
      <rect width="320" height="34" rx="12" fill="#ececec"/>
      <rect y="22" width="320" height="12" fill="#ececec"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
      <rect x="84" y="9" width="200" height="16" rx="8" fill="#ffffff"/>
      <rect x="20" y="54" width="280" height="110" rx="8" fill="#dfe6f7"/>
      <rect x="20" y="180" width="180" height="12" rx="6" fill="#d4d4d4"/>
      <rect x="20" y="204" width="270" height="8" rx="4" fill="#e3e3e3"/>
      <rect x="20" y="222" width="250" height="8" rx="4" fill="#e3e3e3"/>
      <rect x="20" y="240" width="264" height="8" rx="4" fill="#e3e3e3"/>
    </g>

    <!-- the haze -->
    <rect width="960" height="440" fill="#05060a" opacity="0.55"/>

    <!-- focused window: code editor (center, above the haze) -->
    <g transform="translate(250 96)" filter="url(#shadow)">
      <rect width="460" height="290" rx="12" fill="#1d1f27"/>
      <rect width="460" height="34" rx="12" fill="#2a2d38"/>
      <rect y="22" width="460" height="12" fill="#2a2d38"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
      <text x="230" y="22" text-anchor="middle" font-size="12" fill="#9aa0b4">FocusTracker.swift</text>
      <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
        <text x="24" y="70" fill="#c792ea">func <tspan fill="#82aaff">update</tspan><tspan fill="#d6deeb">() {</tspan></text>
        <text x="44" y="94" fill="#c792ea">guard <tspan fill="#d6deeb">let id = focusedWindowID()</tspan></text>
        <text x="44" y="118" fill="#c792ea">else <tspan fill="#d6deeb">{ overlay.</tspan><tspan fill="#82aaff">hide</tspan><tspan fill="#d6deeb">(); </tspan><tspan fill="#c792ea">return</tspan><tspan fill="#d6deeb"> }</tspan></text>
        <text x="44" y="142" fill="#d6deeb">overlay.<tspan fill="#82aaff">show</tspan>(below: id)</text>
        <text x="24" y="166" fill="#d6deeb">}</text>
        <text x="24" y="206" fill="#637777">// No timers. No polling. It sleeps</text>
        <text x="24" y="230" fill="#637777">// until you switch windows.</text>
      </g>
      <rect x="24" y="250" width="2" height="16" fill="#82aaff"/>
    </g>

    <!-- menu bar -->
    <rect width="960" height="28" fill="#0b0c12" opacity="0.55"/>
    <text x="22" y="19" font-size="13" font-weight="600" fill="#ffffff">Xcode</text>
    <g transform="translate(818 14)">
      <circle r="7" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M0 -7 A7 7 0 0 0 0 7 Z" fill="#ffffff"/>
    </g>
    <text x="938" y="19" font-size="13" fill="#ffffff" text-anchor="end">9:41</text>
  </g>
</svg>
